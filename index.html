/* ---------- make the target ---------- */
function runMT(){
  const S=shell('Make the target'),dur=150000;
  let solved=0,skipped=0,ended=false,puz=null,tiles=[],sel=null,op=null,hist=[],busy=true;
  S.stage.innerHTML='<p class="mt-target">Target<b></b></p><div class="mt-tiles"></div><p class="msg"></p>';
  const tEl=S.stage.querySelector('.mt-target b'),tilesEl=S.stage.querySelector('.mt-tiles'),msg=S.stage.querySelector('.msg');
  S.controls.innerHTML=`<div class="mt-ops">${['+',MINUS,'×','÷'].map(o=>`<button class="mt-op" type="button" data-op="${o}" aria-label="${{'+':'plus','×':'times','÷':'divide'}[o]||'minus'}">${o}</button>`).join('')}</div><div class="mt-tools"><button class="ghost" type="button" data-a="undo">Undo</button><button class="ghost" type="button" data-a="reset">Reset</button><button class="ghost" type="button" data-a="skip">Skip</button></div>`;
  function newPuzzle(){if(ended)return;puz=genMT();tiles=puz.nums.map(v=>({v,alive:true}));sel=null;op=null;hist=[];tEl.textContent=puz.target;msg.textContent='';render();busy=false;}
  function render(){
    tilesEl.innerHTML=tiles.map((t,k)=>`<button class="tile${t.alive?'':' gone'}${sel===k?' sel':''}" type="button" data-k="${k}"${t.alive?'':' tabindex="-1" aria-hidden="true"'}>${fmt(t.v)}</button>`).join('');
    for(const b of S.controls.querySelectorAll('.mt-op'))b.classList.toggle('sel',b.dataset.op===op);
  }
  tilesEl.addEventListener('click',e=>{
    const b=e.target.closest('.tile');if(!b||busy||ended)return;const k=+b.dataset.k;if(!tiles[k].alive)return;
    if(sel===null||op===null){sel=sel===k?null:k;op=null;msg.textContent='';render();return;}
    if(sel===k){sel=null;op=null;render();return;}
    const a=tiles[sel].v,c=tiles[k].v;let r;
    if(op==='+')r=a+c;else if(op===MINUS)r=a-c;else if(op==='×')r=a*c;
    else{if(c===0||a%c!==0){msg.textContent=`${fmt(a)} ÷ ${fmt(c)} is not a whole number.`;return;}r=a/c;}
    hist.push(tiles.map(t=>Object.assign({},t)));
    tiles[k]={v:r,alive:true};tiles[sel].alive=false;sel=k;op=null;msg.textContent='';
    const alive=tiles.filter(t=>t.alive);
    if(alive.length===1){
      if(alive[0].v===puz.target){solved++;S.score.textContent=solved;msg.innerHTML='<b class="good">Solved.</b>';busy=true;render();later(newPuzzle,650);return;}
      msg.textContent=`That makes ${fmt(alive[0].v)}, not ${puz.target}. Undo or reset.`;
    }
    render();
  });
  S.controls.addEventListener('click',e=>{
    if(busy||ended)return;
    const o=e.target.closest('.mt-op');
    if(o){if(sel===null){msg.textContent='Pick a number first.';return;}op=op===o.dataset.op?null:o.dataset.op;render();return;}
    const a=e.target.closest('[data-a]');if(!a)return;
    if(a.dataset.a==='undo'){if(hist.length){tiles=hist.pop();sel=null;op=null;msg.textContent='';render();}}
    else if(a.dataset.a==='reset'){if(hist.length){tiles=hist[0];hist=[];}sel=null;op=null;msg.textContent='';render();}
    else{skipped++;busy=true;msg.innerHTML=`One way: <b>${esc(puz.sol)}</b>`;later(newPuzzle,2400);}
  });
  const timer=countdown(dur,(rem,f)=>{setClock(S,rem,f);S.clock.classList.toggle('low',rem<10000);},()=>finish());
  function finish(){
    if(ended)return;ended=true;timer.stop();
    const prev=best('mt');record('mt',solved);
    results({id:'mt',prevBest:prev,title:'Make the target',big:solved,unit:'solved',lines:[['Solved',solved],['Skipped',skipped]],html:`<p class="note">Work backwards from the target: look for a factor pair or a near miss you can fix with the last number.</p>`,again:runMT});
  }
  newPuzzle();
}


/* ---------- ladder progress ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function lvState(id){return store.lv[id]||(store.lv[id]={days:[],runs:0});}
function mastered(id){const s=store.lv[id];return !!s&&s.days.length>=2;}
function suggested(g){for(const L of LEVELS)if(L.grp===g&&!L.opt&&!mastered(L.id))return L.id;return null;}
function factRec(key,ok,ms){const f=store.facts[key]=store.facts[key]||{t:[],s:0,w:0,n:0};f.n++;if(ok){f.t.push(Math.round(ms));if(f.t.length>5)f.t.shift();f.s++;f.w=0;}else{f.s=0;f.w=1;}}
function factMed(f){return f&&f.t.length?median(f.t.slice(-3)):null;}
function factColor(key){const f=store.facts[key];if(!f||!f.n)return'g0';if(f.w)return'red';const m=factMed(f);if(m===null)return'red';if(m<1500&&f.s>=3)return'green';if(m<3000)return'yellow';return'red';}
const FW={g0:4,red:5,yellow:3,green:1};
function pickKey(keys,recent){
  let tot=0;const w=keys.map(k=>{const v=(keys.length>3&&recent.indexOf(k)>=0)?0:FW[factColor(k)];tot+=v;return v;});
  let r=Math.random()*tot;for(let i=0;i<keys.length;i++){r-=w[i];if(r<0)return keys[i];}return keys[keys.length-1];
}
function slowScore(k){const f=store.facts[k];if(!f)return 0;if(f.w)return 1e9+f.n;return factMed(f)||0;}
function prepQ(q,L){
  if(!q)return q;
  if(L&&!q.lv)q.lv=L.id;
  if(!q.kind)q.kind='type';
  if(q.ans===undefined)q.ans=fmt(q.x);
  if(L&&L.mode==='paced')q.paced=true;
  return q;
}
function factSource(keys){const recent=[];return()=>{const k=pickKey(keys,recent);recent.push(k);if(recent.length>2)recent.shift();return prepQ(factQ(k),LV[levelOfKey(k)]);};}
function levelSource(L){return L.keys?factSource(L.keys):()=>prepQ(L.gen(),L);}
const KEEP=['lv','key','kind','q','html','sub','long','seq','x','ans','tol','neg','dot','slash','opts','ex','paced','hint','unit'];
function strip(q){const o={};for(const k of KEEP)if(q[k]!==undefined)o[k]=q[k];return o;}
function missAdd(q){if(!q.lv)return;const a=store.miss[q.lv]=store.miss[q.lv]||[];if(a.some(x=>x.q===q.q&&x.ans===q.ans))return;const c=strip(q);c.ts=Date.now();a.unshift(c);if(a.length>20)a.length=20;}
function missDrop(q){const a=store.miss[q.lv];if(!a)return;const i=a.findIndex(x=>x.q===q.q&&x.ans===q.ans);if(i>=0)a.splice(i,1);if(!a.length)delete store.miss[q.lv];}
const secs=ms=>ms===null||ms===undefined?'none':(ms/1000).toFixed(1)+' s';

function pausable(ms,onTick,onEnd){
  let left=ms,t0=performance.now(),raf=0,run=true,done=false;
  function f(now){if(done||!run)return;const rem=Math.max(0,left-(now-t0));onTick(rem,rem/ms);if(rem<=0){done=true;if(onEnd)onEnd();return;}raf=requestAnimationFrame(f);}
  const api={
    pause(){if(!run||done)return;left=Math.max(0,left-(performance.now()-t0));run=false;cancelAnimationFrame(raf);},
    resume(){if(run||done)return;run=true;t0=performance.now();raf=requestAnimationFrame(f);},
    stop(){done=true;cancelAnimationFrame(raf);}
  };
  onTick(ms,1);raf=requestAnimationFrame(f);cleanups.push(api.stop);return api;
}

/* ---------- one runner for levels, warm-up and custom drills ---------- */
function runSession(cfg){
  const L=cfg.level||null,S=shell(cfg.title),N=cfg.N||0;
  let fresh=0,asked=0,cur=null,ended=false,busy=true,clock=null,correct=0;
  const log=[],reask=[],pre=(cfg.pre||[]).slice();
  if(cfg.dur)clock=pausable(cfg.dur,(rem,f)=>{setClock(S,rem,f);S.clock.classList.toggle('low',rem<10000);},()=>finish());
  else setProgress(S,0,N,`0 of ${N}`);
  S.root.querySelector('.quit').addEventListener('click',()=>save());
  function pickNext(){
    const i=reask.findIndex(r=>r.due<=asked);
    if(i>=0)return reask.splice(i,1)[0].q;
    if(N&&fresh>=N)return reask.length?reask.shift().q:null;
    fresh++;
    if(pre.length)return pre.shift();
    return cfg.source();
  }
  function next(){
    if(ended)return;
    cur=pickNext();if(!cur)return finish();
    asked++;busy=false;
    if(!cfg.dur)setProgress(S,fresh-1,N,`${Math.min(fresh,N)} of ${N}`);
    const big=!cur.long&&!cur.seq;
    S.stage.classList.toggle('top',!big);
    const len=(cur.q||'').length,size=len<=9?'s1':len<=13?'s2':'s3';
    const prompt=cur.seq?`<div class="seq">${seqHTML(cur.seq,false)}</div>`:cur.long?`<p class="oq">${esc(cur.q)}</p>`:`<div class="problem ${size}">${cur.html||esc(cur.q)}</div>`;
    const tag=cur.again?'Again: you missed this one':cur.fromMiss?'Missed last time':'';
    const label=cfg.dur?`Question ${asked}${tag?' · '+tag.toLowerCase():''}`:tag;
    S.stage.innerHTML=`<div class="qnum">${label}</div>${cur.sub?`<p class="sub">${esc(cur.sub)}</p>`:''}${prompt}${cur.kind==='type'?`<div class="entry"><span class="ev"></span>${cur.unit?`<span class="unit">${esc(cur.unit)}</span>`:''}</div><p class="hint">${esc(cur.hint||(cur.slash?'Use / for fractions':''))}</p>`:''}<div class="fb-slot"></div>`;
    S.stage.scrollTop=0;S.controls.innerHTML='';
    if(cur.kind==='type'){
      const ev=S.stage.querySelector('.ev'),hint=S.stage.querySelector('.hint');
      const auto=!cur.paced&&/^\d+$/.test(cur.ans)?cur.ans.length:0;
      cur.kp=keypad(S.controls,{neg:!!cur.neg,dot:!!cur.dot,slash:!!cur.slash,max:10,autoLen:auto,onChange:v=>{ev.textContent=v;},onSubmit:v=>{const x=parseAns(v);if(isNaN(x)){hint.textContent='That is not a complete number yet.';return;}answer(v,x,null);}});
    }else{
      S.controls.innerHTML=`<div class="${cur.opts.length===2?'mc2':'ostack'}">${cur.opts.map(o=>`<button class="opt" type="button" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      S.controls.firstChild.addEventListener('pointerdown',e=>{const b=e.target.closest('.opt');if(!b)return;e.preventDefault();answer(b.dataset.v,null,b);});
    }
    cur.t0=performance.now();
  }
  function answer(raw,x,btn){
    if(busy||ended)return;busy=true;
    const q=cur,ms=performance.now()-q.t0;
    const ok=q.kind==='mc'?raw===q.ans:(q.tol?Math.abs(x-q.x)<=q.tol:near(x,q.x));
    if(q.kp)q.kp.lock(true);
    if(q.key)factRec(q.key,ok,ms);
    log.push({lv:q.lv,first:!q.again,ok,ms,q:q.q,ans:q.ans+(q.unit||''),your:raw});
    if(ok){correct++;S.score.textContent=correct;if(q.fromMiss)missDrop(q);}
    else{
      buzz();missAdd(q);
      if((q.tries||0)<2){const c=Object.assign({},q,{again:true,fromMiss:false,tries:(q.tries||0)+1});delete c.kp;reask.push({due:asked+R(2,3),q:c});}
    }
    save();
    if(q.kind==='mc'){for(const b of S.controls.querySelectorAll('.opt'))if(b.dataset.v===q.ans)b.classList.add(ok?'is-right':'is-answer');if(btn&&!ok)btn.classList.add('is-wrong');}
    if(q.paced){
      if(clock)clock.pause();
      if(q.seq)S.stage.querySelector('.seq').innerHTML=seqHTML(q.seq,true);
      const h=S.stage.querySelector('.hint');if(h)h.remove();
      S.stage.querySelector('.fb-slot').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><p class="verdict">${ok?'Correct':'Not quite'}</p>${ok?'':`<p>The answer is <b>${esc(q.ans)}${esc(q.unit||'')}</b>.</p>`}<p>${esc(q.ex||'')}</p>${!ok&&(q.tries||0)<2?'<p class="exact">This one comes back in a few questions.</p>':''}</div>`;
      if(q.kind==='type')S.controls.innerHTML='';
      nextButton(S.controls,(N&&fresh>=N&&!reask.length)?'See results':'Next',()=>{if(clock)clock.resume();next();});
    }else if(ok){later(next,120);}
    else{
      const line=q.ex?esc(q.ex):q.kind==='mc'?esc(q.ans):`${esc(q.q)} = <b>${esc(q.ans)}${esc(q.unit||'')}</b>`;
      S.stage.querySelector('.fb-slot').innerHTML=`<p class="fbline"><span class="bad">${raw===null?'Time':'Not quite.'}</span> ${line}</p>`;
      later(next,q.ex?2200:1300);
    }
  }
  function finish(){
    if(ended)return;ended=true;if(clock)clock.stop();
    const firsts=log.filter(l=>l.first&&(!L||l.lv===L.id)),n=firsts.length,okN=firsts.filter(l=>l.ok).length;
    const acc=n?okN/n:0,med=median(firsts.filter(l=>l.ok).map(l=>l.ms));
    const prev=best(cfg.hid);record(cfg.hid,okN);
    const lines=[['Right on first try',`${okN} of ${n}`],['Accuracy',n?Math.round(acc*100)+'%':'none'],['Median time when right',secs(med)]];
    const again=log.filter(l=>!l.first);if(again.length)lines.push(['Re-asked misses',`${again.filter(l=>l.ok).length} of ${again.length} right`]);
    let msg='',more=[];
    if(L){
      const st=lvState(L.id),minN=L.mode==='paced'?LEVEL_N:10,was=mastered(L.id);
      const pass=n>=minN&&acc>=0.9&&med!==null&&med<=L.limit*1000;
      st.runs++;st.lastAcc=acc;st.lastMed=med;
      if(st.bestAcc===undefined||acc>st.bestAcc||(acc===st.bestAcc&&med!==null&&(st.bestMed===null||med<st.bestMed))){st.bestAcc=acc;st.bestMed=med;}
      const d=today(),already=st.days.indexOf(d)>=0;
      if(pass&&!already){st.days.push(d);if(st.days.length>6)st.days.splice(0,st.days.length-6);}
      save();
      lines.push(['Limit',`${L.limit.toFixed(1)} s median, 90% right`]);
      const why=[];if(n<minN)why.push(`answer at least ${minN} questions`);if(n&&acc<0.9)why.push(`get 90% right (you got ${Math.round(acc*100)}%)`);if(med!==null&&med>L.limit*1000)why.push(`bring the median under ${L.limit.toFixed(1)} s (yours was ${secs(med)})`);if(med===null&&n>=minN)why.push('get some right');
      if(!pass)msg=`<p class="note">Not a pass yet. To pass, ${why.join(' and ')}.</p>`;
      else if(mastered(L.id)&&!was)msg=`<p class="pb">Level mastered</p><p class="note">Two passes on different days. Keep it fresh with the daily warm-up.</p>`;
      else if(was)msg=`<p class="note">Pass. This level is already mastered.</p>`;
      else if(already)msg=`<p class="note">Pass, but you already passed today. Pass again on another day to master this level.</p>`;
      else msg=`<p class="pb">Pass 1 of 2</p><p class="note">Pass again on another day to master this level.</p>`;
      const idx=LEVELS.indexOf(L),nx=LEVELS.slice(idx+1).find(l=>l.grp===L.grp);
      if(nx)more.push([`Next: ${nx.id} ${nx.name}`,()=>lvIntro(nx)]);
    }
    const miss=log.filter(l=>l.first&&!l.ok);
    const missHTML=miss.length?`<h2 class="h-sm">Missed</h2><ul class="misses">${miss.slice(0,30).map(m=>`<li><span>${esc(m.q)} = <b>${esc(m.ans)}</b></span><span class="you">${m.your===null?'no answer':'you: '+esc(m.your)}</span></li>`).join('')}</ul><p class="note">Misses come back at the start of your next session.</p>`:'';
    results({id:cfg.hid,prevBest:prev,title:cfg.title,big:okN,unit:'right',lines,html:msg+missHTML,again:cfg.again,more});
  }
  next();
}

function runLevel(L){
  const pre=(store.miss[L.id]||[]).slice(0,5).map(q=>Object.assign({},q,{fromMiss:true}));
  runSession({title:`${L.id} ${L.name}`,hid:L.id,level:L,dur:L.mode==='fast'?60000:0,N:L.mode==='paced'?LEVEL_N:0,pre,source:levelSource(L),again:()=>runLevel(L)});
}
function runWarm(){
  const ms=[];for(const id in store.miss)for(const q of store.miss[id])ms.push(q);
  ms.sort((a,b)=>(b.ts||0)-(a.ts||0));
  const pre=ms.slice(0,10).map(q=>Object.assign({},q,{fromMiss:true}));
  const slow=Object.keys(store.facts).filter(k=>factColor(k)!=='green'&&levelOfKey(k)).sort((a,b)=>slowScore(b)-slowScore(a)).slice(0,10);
  const sq=shuffle(slow.concat(slow));
  for(let i=1;i<sq.length;i++)if(sq[i]===sq[i-1]){const j=(i+2)%sq.length;const t=sq[i];sq[i]=sq[j];sq[j]=t;}
  for(const k of sq)pre.push(prepQ(factQ(k),LV[levelOfKey(k)]));
  const mast=LEVELS.filter(l=>mastered(l.id)),ml=mast.length?pick(mast):LV[suggested('A')||'A1'];
  runSession({title:'Daily warm-up',hid:'warm',level:null,dur:300000,pre,source:levelSource(ml),again:runWarm});
}
function runFacts(keys,title,hid){
  runSession({title,hid,level:null,dur:60000,source:factSource(keys),again:()=>runFacts(keys,title,hid)});
}

function backupImport(box){
  box.innerHTML=`<p class="note">Choose a backup file, or paste backup text. Importing replaces the progress on this phone.</p><div class="btn-row"><label class="ghost file-btn">Choose file<input type="file" accept="application/json,.json,text/plain" hidden></label></div><textarea class="bk-text" placeholder="Or paste backup text here"></textarea><div class="btn-row"><button class="primary" type="button" data-b="go">Import pasted text</button></div><p class="msg"></p>`;
  const ta=box.querySelector('textarea'),msg=box.querySelector('.msg'),go=box.querySelector('[data-b="go"]');let armed=null;
  function apply(txt){
    let p;try{p=JSON.parse(txt);}catch(e){msg.textContent='That is not a valid backup.';return;}
    const s=p&&p.app==='oa-drills'&&p.store?p.store:(p&&p.hist?p:null);
    if(!s||typeof s!=='object'){msg.textContent='That is not an OA drills backup.';return;}
    if(armed!==txt){armed=txt;msg.innerHTML='<b class="bad">This replaces your current progress.</b> Tap import again to confirm.';go.textContent='Confirm import';return;}
    store.hist=s.hist&&typeof s.hist==='object'?s.hist:{};store.facts=s.facts&&typeof s.facts==='object'?s.facts:{};store.lv=s.lv&&typeof s.lv==='object'?s.lv:{};store.miss=s.miss&&typeof s.miss==='object'?s.miss:{};if(s.set&&typeof s.set==='object')Object.assign(store.set,s.set);
    save();applyTheme();msg.innerHTML=`<b class="good">Imported.</b> ${Object.keys(store.hist).length} drills and ${Object.keys(store.facts).length} facts.`;go.textContent='Import pasted text';armed=null;
  }
  go.addEventListener('click',()=>apply(ta.value.trim()));
  box.querySelector('input[type=file]').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=String(r.result);armed=null;apply(ta.value.trim());};r.readAsText(f);});
}

/* ---------- routes ---------- */
const GO={
  warm(){runWarm();},
  m80(){intro({id:'m80',title:'80 in 8',how:`<p>80 multiple-choice questions in 8 minutes: whole numbers, decimals, fractions and percentages. That is 6 seconds a question.</p><p>Tap an option to answer. A wrong tap briefly shows the right one. Skipping scores zero.</p>`,settings:toggleHTML('neg','Wrong answers cost a point'),bind:d=>bindToggle(d,'neg'),start:()=>runMM(true,'all')});},
  sprint(){let cat=store.set.sprintCat;intro({id:'sprint-'+cat,title:'Sprint',how:`<p>Two minutes on one topic. Answer as many as you can.</p>`,
    settings:`<div class="chips" role="group" aria-label="Topic">${SPRINT_CATS.map(c=>`<button class="chip" type="button" data-c="${c[0]}" aria-pressed="${c[0]===cat}">${c[1]}</button>`).join('')}</div>${toggleHTML('neg','Wrong answers cost a point')}`,
    bind:(d,renderHist)=>{bindToggle(d,'neg');d.querySelector('.chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;store.set.sprintCat=cat;save();d.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.c===cat)));renderHist('sprint-'+cat);});},
    start:()=>runMM(false,cat)});},
  seq(){intro({id:'seq',title:'Sequences',how:`<p>Type the number that replaces the question mark. Answers can be negative or fractions; use / for the fraction bar.</p><p>You see the rule after every answer.</p>`,settings:toggleHTML('seqTimer','One minute per sequence'),bind:d=>bindToggle(d,'seqTimer'),start:runSeq});},
  odds(){intro({id:'odds',title:'Beat the odds',how:`<p>10 probability and expected-value questions with 90 seconds each. The options are rounded, so choose the one closest to the exact answer.</p><p>Every answer comes with a short worked solution.</p>`,start:runOdds});},
  pin(){intro({id:'pin',title:'Pincode',how:`<p>Digits flash one at a time. Type them back in the same order.</p><p>Get it right and the next code is one digit longer. Three mistakes end the game.</p>`,start:runPin});},
  cc(){intro({id:'cc',title:'Code compare',how:`<p>Tap the option that exactly matches the code on top. Expect look-alikes such as O and 0, or 5 and S.</p><p>Each correct answer shortens the time for the next code. One minute in total.</p>`,start:runCC});},
  ts(){intro({id:'ts',title:'Task switch',how:`<p>An arrow and a number appear in the top or bottom half of the box.</p><p>Top half: tap the way the arrow points. Bottom half: tap left for odd, right for even. 40 trials, and the rule changes without warning.</p>`,start:runTS});},
  bal(){intro({id:'bal',title:'Balloon',how:`<p>16 balloons, blue and orange. Each pump adds 5 points. Collect to bank them; a pop loses that balloon's points.</p><p>Each colour pops somewhere in its own hidden range. Learn it as you play.</p>`,start:runBal});},
  mt(){intro({id:'mt',title:'Make the target',how:`<p>Use all four numbers once each, with + ${MINUS} × ÷, to reach the target. Tap a number, an operator, then another number.</p><p>Two and a half minutes. Skip shows one solution.</p>`,start:runMT});},
};
if(!SPRINT_CATS.some(c=>c[0]===store.set.sprintCat))store.set.sprintCat='all';
applyTheme();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(app.querySelector('.home-head'))home();});
window.addEventListener('appinstalled',()=>{installEvt=null;});
if('serviceWorker' in navigator&&/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
home();
})();
</script>
